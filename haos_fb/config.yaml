name: "HAOS Dashboard Display"
version: "1.1.2"
slug: "haos_fb"
description: "Renders HAOS Dashboard system stats to /dev/fb0 (HDMI / VGA / DSI panel)."
url: "https://github.com/neon9809/haos-ha"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false
startup: services
boot: auto
hassio_api: true
hassio_role: default
homeassistant_api: true
host_network: false
devices:
  - "/dev/fb0:/dev/fb0:rwm"
ports:
  8199/tcp: null
ports_description:
  8199/tcp: "Optional: HTTP control endpoint for manual redraw / theme reload. Not required by the integration."
map:
  - "share:rw"
options:
  theme: midnight
  accent: ""
  refresh: 2
  temp_unit: C
  rotate: 0
  screen_inches: 0
  page_interval: 10
  pages:
    - status
    - cpu
    - memory
    - network
    - disks
schema:
  theme: "list(midnight|graphite|emerald|sunshine|cherry|cloud)"
  accent: "str?"
  refresh: "int(1,30)"
  temp_unit: "list(C|F)"
  rotate: "list(0|90|180|270)"
  screen_inches: "float(0,100)"
  page_interval: "int(0,300)"
  pages: "list(status|cpu|memory|network|disks|info)"
image: "ghcr.io/kou147258/haos-fb-{arch}"