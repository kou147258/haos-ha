name: "HAOS Dashboard Display"
version: "1.4.0"
slug: "haos_fb"
description: "Renders HAOS Dashboard system stats to /dev/fb0 (HDMI / VGA / DSI panel)."
url: "https://github.com/kou147258/haos-ha"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
# Supervisor runs this add-on as the host's init process (PID 1).
# This gives the container direct access to /dev/fb0 iomem mmap —
# bypassing the user-namespace LSM hook that rejects efifb mmap
# from regular Supervisor add-on containers on HAOS 18.2 x86_64.
# This is the same mechanism the official SSH, Terminal, and Portainer
# add-ons use to manage host hardware.
init: true
startup: services
boot: auto
hassio_api: true
hassio_role: default
homeassistant_api: true
host_network: false
host_pid: true
devices:
  - "/dev/fb0:/dev/fb0:rwm"
ports:
  8199/tcp: null
ports_description:
  8199/tcp: "Optional: HTTP control endpoint for manual redraw / theme reload. Not required by the integration."
map:
  - "share:rw"
options:
  theme: midnight
  accent: ""
  refresh: 2
  temp_unit: C
  rotate: 0
  screen_inches: 0
  page_interval: 10
  pages:
    - status
    - cpu
    - memory
    - network
    - disks
    - info
schema:
  theme: "list(midnight|graphite|emerald|sunshine|cherry|cloud)"
  accent: "str?"
  refresh: "int(1,30)"
  temp_unit: "list(C|F)"
  rotate: "list(0|90|180|270)"
  screen_inches: "float(0,100)"
  page_interval: "int(0,300)"
  # `pages` is a list-typed option, so its schema is a YAML list of one
  # item-schema string. Supervisor applies that schema per element.
  # (Using a bare string here makes Supervisor treat the whole list as a
  # single enum value and reject it with "value must be one of [...]".)
  pages:
    - "list(status|cpu|memory|network|disks|info)"
image: "ghcr.io/kou147258/haos-fb-{arch}"