name: "HAOS Dashboard Display"
version: "1.2.2"
slug: "haos_fb"
description: "Renders HAOS Dashboard system stats to /dev/fb0 (HDMI / VGA / DSI panel)."
url: "https://github.com/kou147258/haos-ha"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false
startup: services
boot: auto
hassio_api: true
hassio_role: default
homeassistant_api: true
host_network: false
# Privileged capabilities for /dev/fb0 mmap.
#
# HAOS Supervisor add-on containers default to a locked-down cgroup +
# capability set that denies raw I/O to /dev/fb0. Opening /dev/fb0 with
# O_RDWR returns EINVAL (errno 22) from inside the container even when
# the host's efifb/amdgpu/etc. driver is fully loaded and /proc/fb
# reports the device — the kernel refuses the mmap.
#
# `full_access: true` is the Supervisor-supported "privileged add-on"
# toggle that lets the container pass through all device + cgroup +
# userns restrictions. We pair it with explicit bind mounts so the
# device node actually exists in /dev inside the container.
#
# This is the same mechanism the official SSH, Terminal, and Portainer
# add-ons use to access host hardware. Without it, /dev/fb0 mmap fails
# silently with EINVAL even with SYS_ADMIN + SYS_RAWIO granted.
full_access: true
host_dbus: true
devices:
  - "/dev/fb0:/dev/fb0:rwm"
  - "/dev/dri:/dev/dri:rwm"
ports:
  8199/tcp: null
ports_description:
  8199/tcp: "Optional: HTTP control endpoint for manual redraw / theme reload. Not required by the integration."
map:
  - "share:rw"
options:
  theme: midnight
  accent: ""
  refresh: 2
  temp_unit: C
  rotate: 0
  screen_inches: 0
  page_interval: 10
  pages:
    - status
    - cpu
    - memory
    - network
    - disks
    - info
schema:
  theme: "list(midnight|graphite|emerald|sunshine|cherry|cloud)"
  accent: "str?"
  refresh: "int(1,30)"
  temp_unit: "list(C|F)"
  rotate: "list(0|90|180|270)"
  screen_inches: "float(0,100)"
  page_interval: "int(0,300)"
  # `pages` is a list-typed option, so its schema is a YAML list of one
  # item-schema string. Supervisor applies that schema per element.
  # (Using a bare string here makes Supervisor treat the whole list as a
  # single enum value and reject it with "value must be one of [...]".)
  pages:
    - "list(status|cpu|memory|network|disks|info)"
image: "ghcr.io/kou147258/haos-fb-{arch}"