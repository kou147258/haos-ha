name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & compile-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # No `cache: pip` — we don't have a requirements.txt / pyproject.toml
          # at the repo root, and actions/setup-python@v5 requires one when
          # caching is enabled. Our deps live in
          # custom_components/haos/manifest.json (HA-specific format).

      - name: Install linters
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet yamllint

      - name: Compile-check Python
        run: |
          set -e
          python -m compileall -q -j 0 custom_components/haos
          python -m compileall -q -j 0 tests

      - name: Validate JSON
        run: |
          set -e
          python - <<'PY'
          import json, pathlib, sys
          bad = []
          for p in pathlib.Path('.').rglob('*.json'):
              if any(part in ('node_modules', '.git', 'dist', 'build') for part in p.parts):
                  continue
              try:
                  json.load(open(p, encoding='utf-8'))
              except Exception as err:
                  bad.append((p, err))
          for p, err in bad:
              print(f'  FAIL {p}: {err}')
          if bad:
              sys.exit(1)
          print('OK — all JSON files valid')
          PY

      - name: Validate YAML
        run: |
          set -e
          python - <<'PY'
          import sys, yaml, pathlib
          for p in list(pathlib.Path('.github').rglob('*.y*ml')) + \
                   [pathlib.Path('.yamllint.yml')]:
              try:
                  yaml.safe_load(open(p, encoding='utf-8'))
                  print('OK', p)
              except Exception as err:
                  print('FAIL', p, err)
                  sys.exit(1)
          PY

      - name: YAML lint (yamllint)
        run: yamllint .yamllint.yml custom_components/haos/ .github/

      - name: Check for placeholders
        run: |
          ! grep -RInE 'TODO|FIXME|XXX|<placeholder>|your-token' custom_components/haos tests || (echo 'placeholders found in source'; exit 1)

      - name: Verify integration manifest essentials
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open('custom_components/haos/manifest.json'))
          required = ['domain', 'name', 'version', 'config_flow', 'iot_class',
                      'issue_tracker', 'codeowners', 'requirements']
          missing = [k for k in required if k not in m]
          if missing:
              print(f'Missing manifest keys: {missing}')
              sys.exit(1)
          if m['domain'] != 'haos':
              print(f"Unexpected domain: {m['domain']}")
              sys.exit(1)
          if not isinstance(m.get('requirements', []), list):
              print('requirements must be a list')
              sys.exit(1)
          print('OK')
          PY

  test:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # No `cache: pip` — see comment in the lint job above.

      - name: Install test deps
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet 'psutil>=5.9.0,<7.0.0' pytest

      - name: Run pytest
        run: |
          set -e
          python -m pytest tests/ -v --tb=short --color=yes

  integration-smoke:
    name: Integration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # No `cache: pip` — see comment in the lint job above.

      - name: Install psutil (the only mandatory dep)
        run: python -m pip install --quiet 'psutil>=5.9.0,<7.0.0'

      - name: Verify integration files
        run: |
          set -e
          test -f custom_components/haos/manifest.json
          test -f custom_components/haos/__init__.py
          test -f custom_components/haos/const.py
          test -f custom_components/haos/coordinator.py
          test -f custom_components/haos/sensor.py
          test -f custom_components/haos/binary_sensor.py
          test -f custom_components/haos/switch.py
          test -f custom_components/haos/config_flow.py
          test -f custom_components/haos/addon.py
          test -f custom_components/haos/info.py
          test -f custom_components/haos/services.yaml
          test -f custom_components/haos/strings.json
          test -d custom_components/haos/translations
          python -c "import json; m=json.load(open('custom_components/haos/manifest.json')); assert m['domain']=='haos'; print('manifest OK')"