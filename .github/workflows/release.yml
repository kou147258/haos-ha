name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip pushing images / creating release (build only)'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  build-addon:
    name: Build add-on (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
          - arch: armv7
            platform: linux/arm/v7
          - arch: armhf
            platform: linux/arm/v6
          - arch: i386
            platform: linux/386

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from add-on manifest
        id: version
        run: |
          VERSION=$(python -c "import yaml; print(yaml.safe_load(open('haos_fb/config.yaml'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Addon version: $VERSION"

      - name: Set up QEMU (for non-amd64 builds)
        # CRITICAL: must come BEFORE setup-buildx-action. GitHub Actions
        # runners are x86-64; building for arm/v7/armv6/i386 needs binfmt
        # QEMU user-space emulation registered before Buildx picks a builder.
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.event.inputs.dry_run != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push) image
        uses: docker/build-push-action@v6
        with:
          context: ./haos_fb
          file: ./haos_fb/Dockerfile
          platforms: ${{ matrix.platform }}
          # Dockerfile hardcodes a multi-arch base image (ghcr.io/hassio-addons/base:15.0.2)
          # so no per-arch build-arg is needed.
          tags: |
            ghcr.io/${{ github.repository_owner }}/haos-fb-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/haos-fb-${{ matrix.arch }}:latest
          push: ${{ github.event_name != 'pull_request' && github.event.inputs.dry_run != 'true' }}
          cache-from: type=gha,scope=addon-${{ matrix.arch }}
          cache-to: type=gha,scope=addon-${{ matrix.arch }},mode=max
          provenance: false

  # Note: no multi-arch manifest step. Home Assistant Supervisor resolves
  # the `{arch}` placeholder in the add-on's image: field at install time
  # and pulls the matching per-arch image (ghcr.io/<owner>/haos-fb-{arch}).
  # Creating an OCI manifest list would require the CI token to create a
  # new top-level package, which the GITHUB_TOKEN (a GitHub App
  # installation) can't do when the owner is a user account instead of an
  # org: `denied: installation not allowed to Create organization package`.

  release:
    name: Create GitHub release
    needs: build-addon
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(python -c "import yaml; print(yaml.safe_load(open('haos_fb/config.yaml'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package integration ZIP
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd custom_components
          zip -r "../haos-${VERSION}.zip" haos

      - name: Package add-on ZIP (for Supervisor local install)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd haos_fb
          zip -r "../haos_fb-${VERSION}.zip" .

      - name: Stage release notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## HAOS Dashboard Display add-on

          Install via HA Supervisor → Add-on Store → ⋮ → Repositories →
          paste this repo's URL.

          ### Quick start

          1. HACS → Custom repositories → add this repo → install
             `haos` integration → restart HA.
          2. HA → Add-ons → Add-on Store → install `HAOS Dashboard Display`.
          3. Start the add-on. The `binary_sensor.haos_display_running`
             will go `on` within ~2 s.

          **Important**: the add-on can only drive a directly-attached
          display if your HAOS host is booted in **UEFI mode** with a
          discrete GPU set as the primary display in BIOS. On Legacy
          BIOS + integrated graphics (efifb), the kernel's LSM rejects
          mmap of /dev/fb0 from inside the Supervisor add-on container.
          See README §"Display mode — when it works" for the full
          hardware requirement list.

          See the README for the full installation guide and per-architecture
          multi-arch manifest.

          ## Artifacts

          - `haos-${VERSION}.zip` — drop-in HACS-compatible bundle
            of the custom integration (no HACS install).
          - ghcr.io multi-arch images — referenced automatically by the
            add-on's `image:` field in `haos_fb/config.yaml`.

          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: |
            haos-${{ steps.version.outputs.version }}.zip
            haos_fb-${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}