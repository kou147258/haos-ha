name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip creating release (build only)'
        type: boolean
        default: false

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(python -c "import json; print(json.load(open('custom_components/haos/manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Integration version: $VERSION"

      - name: Package integration ZIP (HACS drop-in)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd custom_components
          zip -r "../haos-${VERSION}.zip" haos

      - name: Stage release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > RELEASE_NOTES.md <<EOF
          ## HAOS Dashboard integration v${VERSION}

          HACS-installable Home Assistant integration that exposes HAOS host
          system stats (CPU per-core, memory, swap, disks, network,
          temperatures, uptime, processes, hostname, OS) as sensor entities,
          plus an \`info\` sensor summarising HA Core / Supervisor / HAOS /
          integration versions and live entity counts.

          ### Install via HACS

          1. HA → **HACS** → **Integrations** → top-right ⋮ → **Custom repositories**
          2. Repository: \`https://github.com/kou147258/haos-ha\`, Category: \`Integration\`
          3. Install **HAOS Dashboard** and restart Home Assistant.

          ### Manual install (offline-friendly)

          Download \`haos-${VERSION}.zip\` from this release, unzip to get the
          \`haos/\` folder, and drop it into \`/config/custom_components/haos/\`.
          Restart HA.

          ### Notes on display mode

          Display takeover (rendering sensor data to \`/dev/fb0\` on a directly
          attached HDMI/VGA panel) is **not** part of v${VERSION}. It proved
          structurally infeasible on HAOS x86_64 + Legacy BIOS because
          \`efifb\` early-binds the framebuffer and the kernel cmdline cannot
          be changed from a Supervisor add-on container. See README §"Why no
          display mode" for the full diagnosis.

          ## Artifacts

          - \`haos-${VERSION}.zip\` — drop-in HACS-compatible bundle of the
            custom integration (no HACS install required).
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: |
            haos-${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}