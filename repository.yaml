# HACS default-repo manifest.
#
# HACS reads this file when the user adds the repo via
# Settings → HACS → Integrations → ⋮ → Custom repositories
# with the "HACS default" toggle off. Keeping it at the repo root
# eliminates the "manifest.json not found" warning HACS shows when
# scanning a repo that doesn't expose one.
name: "HAOS Dashboard"
render_readme: false
country: ["CN"]
default_branch: main